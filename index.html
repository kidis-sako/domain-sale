<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Domains available for sale." />
  <title>Domains for Sale</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #111111;
      --muted: #6f6f6f;
      --border: #dedede;
      --accent: #111111;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    .wrap {
      width: 100%;
      max-width: 720px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 42px;
      box-shadow: 0 10px 30px rgba(0,0,0,.04);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.08;
    }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    .domains {
      display: grid;
      gap: 10px;
      margin: 0 0 34px;
    }

    .domain {
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-weight: 700;
      background: #fafafa;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .small {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 13px;
    }

    label {
      font-size: 14px;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cfcfcf;
      border-radius: 9px;
      font: inherit;
      background: #fff;
      color: #111;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 4px;
      padding: 14px 18px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { opacity: .88; }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #888;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Domains for Sale</h1>
      <p class="intro">
        These domains are available for purchase.
        Interested in one or more? Send an offer using the form below.
      </p>

      <h2>Contact</h2>
      <p class="small">Your message will be sent directly to the domain owner.</p>

      <form action="https://formsubmit.co/sakokidis@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="Domain inquiry" />
        <input type="hidden" name="_next" value="https://kidis-sako.github.io/domain-sale/thank-you.html" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />

        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>

        <div>
          <label for="domain">Domain</label>
          <input id="domain" name="domain" type="text" required />
        </div>

        <div>
          <label for="offer">Offer (optional)</label>
          <input id="offer" name="offer" type="text" placeholder="e.g. €2,500" />
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required placeholder="Tell me which domain you're interested in and your offer."></textarea>
        </div>

        <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;" />

        <button type="submit">Send Inquiry</button>
      </form>
    </section>

    <div class="footer">Domain sale inquiries only.</div>
  </main>
</body>
</html>
